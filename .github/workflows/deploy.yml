name: Deploy Next.js to Production (Zero Downtime)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Zero-Downtime Deployment
    runs-on: self-hosted
    steps:
      - name: Trigger Zero-Downtime Deployment
        run: |
          echo "🚀 Starting self-hosted deployment on $(hostname)..."
          sudo bash /var/www/creatorin/deploy.sh

