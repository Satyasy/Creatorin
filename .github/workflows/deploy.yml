name: Deploy Next.js to Production (Zero Downtime)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            # Inisialisasi repo jika belum ada di VPS
            if [ ! -d "/var/www/creatorin/.git" ]; then
              cd /var/www
              rm -rf creatorin
              git clone git@github.com:${{ github.repository }}.git creatorin
            fi

            # Jalankan zero downtime deployment script
            bash /var/www/creatorin/deploy.sh
